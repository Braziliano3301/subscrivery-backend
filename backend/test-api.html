<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste API Subscrivery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2rem;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .test-section {
            margin-bottom: 25px;
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: #f8f9fa;
        }
        h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-height: 300px;
            overflow-y: auto;
        }
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        .token-box {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Testes API Subscrivery</h1>
        <p class="subtitle">Clique nos botões para testar a API</p>

        <!-- Teste 1: Health Check -->
        <div class="test-section">
            <h2>1️⃣ Health Check</h2>
            <button onclick="testHealth()">Testar Health Check</button>
            <div id="health-result"></div>
        </div>

        <!-- Teste 2: Registrar Usuário -->
        <div class="test-section">
            <h2>2️⃣ Registrar Usuário Cliente</h2>
            <button onclick="testRegister()">Registrar Cliente</button>
            <div id="register-result"></div>
        </div>

        <!-- Teste 3: Login -->
        <div class="test-section">
            <h2>3️⃣ Login</h2>
            <button onclick="testLogin()">Fazer Login</button>
            <div id="login-result"></div>
        </div>

        <!-- Teste 4: Profile -->
        <div class="test-section">
            <h2>4️⃣ Ver Perfil (Requer Login)</h2>
            <button onclick="testProfile()">Ver Perfil</button>
            <div id="profile-result"></div>
        </div>
    </div>

    <script>
        let authToken = null;

        async function testHealth() {
            const resultDiv = document.getElementById('health-result');
            resultDiv.innerHTML = '<div class="result info">⏳ Testando...</div>';
            
            try {
                const response = await fetch('http://localhost:3000/api/health');
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="result success">
                        ✅ Sucesso!<br>
                        ${JSON.stringify(data, null, 2)}
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        ❌ Erro: ${error.message}
                    </div>
                `;
            }
        }

        async function testRegister() {
            const resultDiv = document.getElementById('register-result');
            resultDiv.innerHTML = '<div class="result info">⏳ Registrando usuário...</div>';
            
            try {
                const response = await fetch('http://localhost:3000/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'cliente@test.com',
                        password: 'senha123',
                        name: 'Cliente Teste',
                        phone: '11999999999',
                        user_type: 'cliente'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    authToken = data.token;
                    resultDiv.innerHTML = `
                        <div class="result success">
                            ✅ Usuário registrado com sucesso!<br>
                            ${JSON.stringify(data.user, null, 2)}
                            <div class="token-box">
                                🔑 Token salvo automaticamente!
                            </div>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="result error">
                            ⚠️ ${data.error || 'Erro desconhecido'}<br>
                            ${data.details ? JSON.stringify(data.details, null, 2) : ''}
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        ❌ Erro: ${error.message}
                    </div>
                `;
            }
        }

        async function testLogin() {
            const resultDiv = document.getElementById('login-result');
            resultDiv.innerHTML = '<div class="result info">⏳ Fazendo login...</div>';
            
            try {
                const response = await fetch('http://localhost:3000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'cliente@test.com',
                        password: 'senha123'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    authToken = data.token;
                    resultDiv.innerHTML = `
                        <div class="result success">
                            ✅ Login realizado com sucesso!<br>
                            ${JSON.stringify(data.user, null, 2)}
                            <div class="token-box">
                                🔑 Token salvo! Agora você pode testar o perfil.
                            </div>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="result error">
                            ❌ ${data.error || 'Erro no login'}
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        ❌ Erro: ${error.message}
                    </div>
                `;
            }
        }

        async function testProfile() {
            const resultDiv = document.getElementById('profile-result');
            
            if (!authToken) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        ⚠️ Você precisa fazer login primeiro!
                    </div>
                `;
                return;
            }
            
            resultDiv.innerHTML = '<div class="result info">⏳ Buscando perfil...</div>';
            
            try {
                const response = await fetch('http://localhost:3000/api/auth/profile', {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="result success">
                            ✅ Perfil carregado!<br>
                            ${JSON.stringify(data.user, null, 2)}
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="result error">
                            ❌ ${data.error || 'Erro ao buscar perfil'}
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        ❌ Erro: ${error.message}
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
